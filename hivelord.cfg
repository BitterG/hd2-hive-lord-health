# hivelord.cfg -- optional; copy to %APPDATA%\Arrowhead\Helldivers2\hivelord.cfg
# The probe runs with these values when the file is absent, so no copy is needed.
#
# stage_sweep     run the game-object-id census (game_object_exists over 1..max_id)
# stage_fields    run the field-batched fingerprint sweep.  This is the only call
#                 in the probe that the shipped DRIVER HUD mod does not prove safe
#                 on arbitrary objects; it is write-ahead logged and resumable.
# stage_dump      write a full field array for every fingerprint candidate
# in_mission_only never run the sweep on the ship
# probe_from      force the Stage D cursor back to an id (normally resumed from
#                 %APPDATA%\Arrowhead\Helldivers2\hivelord_state.txt)
# max_probes      hard cap on Stage D work per launch

debug=true
stage_sweep=true
stage_fields=true
stage_dump=true
in_mission_only=true
probe_from=1
max_probes=20000
sweep_per_frame=128
probe_per_frame=2
probe_budget_ms=8
probe_delay=900
resweep_seconds=20
watch_seconds=1
max_id=32766
