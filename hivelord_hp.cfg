# hivelord_hp.cfg -- optional; copy to %APPDATA%\Arrowhead\Helldivers2\hivelord_hp.cfg
# The reader runs with these values when the file is absent.
#
# hud=true             draw the one-line readout plus its honesty line.  On by default
#                      now that the reading is decoded.  The number shown is the
#                      client-SYNCHRONISED value (6 bits, one step = 2381 HP), not an
#                      exact HP: the exact value is host-side and is not in this
#                      process (see FINDINGS.md §23).  The second line says so.
# hud_bar_width        cells in the bar (default 24).
# scoreboard_seconds   how often the ranked candidate list is appended to the log.
#                      This is the insurance: if the identification guess is wrong,
#                      the answer is already on disk.
# resweep_seconds      full re-census interval while nothing has been IDENTIFIED.  Once a
#                      target is pinned it backs off by 2x up to resweep_backoff_cap.
#                      It deliberately does NOT back off while only a weak candidate is
#                      being watched: a weak candidate is a guess, not a find, and
#                      widening the search interval while the identity is unknown is the
#                      one behaviour that cannot help (a Hive Lord was fought and killed
#                      with the reader running and was never read at all).
# resweep_backoff_cap  maximum backoff multiplier once a target is identified (default 4).
# probe_cycle_seconds  how often the census ids are re-read.  A one-shot probe only sees a
#                      target that already existed when the queue was built.
# shape_dump_min       dump the full field array of any object at least this large, whether
#                      or not it holds a value we recognise.  Requiring a recognised value
#                      is how a target whose array looks different in another mission stays
#                      invisible.
# log_max_bytes        the log is truncated in place when it exceeds this.  It was 2 MB,
#                      which destroyed the per-object SAMPLE history mid-mission.
# main_150k_hint       the offline-verified maximum main health; used as the
#                      reported maximum when the field value cannot be trusted.
# zone_run_min         minimum contiguous run of known zone maxima to treat as the
#                      damage-zone array.

debug=true
hud=true
hud_bar_width=24
sweep=true
in_mission_only=true
max_id=32766
sweep_per_frame=128
probe_per_frame=2
probe_budget_ms=8
probe_delay=300
watch_seconds=0.25
read_seconds=1
scoreboard_seconds=15
resweep_seconds=10
resweep_backoff_cap=4
probe_cycle_seconds=2
shape_dump_min=20
log_max_bytes=16777216
main_150k_hint=150000
zone_run_min=10
try_field_names=false
hud_offset_y=150
hud_scale=1
hud_alpha=0.85
